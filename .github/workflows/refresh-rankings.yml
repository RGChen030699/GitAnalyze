name: Refresh rankings

# Daily rankings refresh (PRD §6: rankings refresh daily, never in real time).
# Secrets: DATABASE_URL (Neon connection URL) and GH_API_TOKEN (a GitHub token for API reads).
# GitHub does not allow secret names that start with GITHUB_, so GH_API_TOKEN is passed in as
# GITHUB_TOKEN, the name the app reads.
on:
  schedule:
    - cron: "10 4 * * *" # 04:10 UTC every day
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-rankings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh rankings
        run: python backend/manage.py refresh_rankings --limit 100
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
