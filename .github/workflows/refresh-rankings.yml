name: Refresh rankings

# Daily rankings refresh (PRD §6: rankings refresh daily, never in real time).
# Secrets: DATABASE_URL (Neon connection URL) and GH_API_TOKEN (a GitHub token for API reads).
# GitHub does not allow secret names that start with GITHUB_, so GH_API_TOKEN is passed in as
# GITHUB_TOKEN, the name the app reads.
#
# 9:00 AM UTC is the main run. 9:25 and 9:50 AM UTC are backup checks: each refreshes only if no
# run of this workflow has succeeded yet today (UTC), in case GitHub skipped or the main run failed.
on:
  schedule:
    - cron: "0 9 * * *" # main daily run, 9:00 AM UTC (4:00 AM EST, 5:00 AM during daylight saving)
    - cron: "25 9 * * *" # first backup check, 9:25 AM UTC
    - cron: "50 9 * * *" # second backup check, 9:50 AM UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: refresh-rankings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip a backup check if today's refresh already succeeded
        id: check
        if: github.event.schedule == '25 9 * * *' || github.event.schedule == '50 9 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          done_runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow refresh-rankings.yml \
            --status success --created ">=$today" --json databaseId --jq length)
          if [ "$done_runs" -gt 0 ]; then
            echo "Today's refresh already succeeded; nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful refresh yet today; running the backup."
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.done != 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.check.outputs.done != 'true'
      - name: Refresh rankings
        if: steps.check.outputs.done != 'true'
        run: python backend/manage.py refresh_rankings --limit 1000
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          RANKINGS_LANGUAGES: Python,Java,TypeScript,JavaScript,C#,PHP,C++,Go,Rust,Swift,Kotlin,C,Ruby,Dart,Scala,Shell,R,Jupyter Notebook
